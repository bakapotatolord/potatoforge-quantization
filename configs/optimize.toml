format_version = 1

[paths]
audit_report = "reports/weight-audit.json"
profile = "profiles/generated/candidate.json"

[optimize]
profile_id = "candidate"
target_size_gib = 4.0
methods = ["int8", "int8_convrot", "int5_convrot", "int5_convrot_mse", "int6_convrot", "int6_convrot_mse", "convrot_w4a4", "convrot_w4a4_mse"]
# MSE actions keep ordinary INT5/INT6/INT7 ConvRot storage and runtime markers.
exclude_prefixes = []
exclude_suffixes = []
overwrite = false
