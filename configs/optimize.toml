format_version = 1

[paths]
audit_report = "reports/weight-audit.json"
profile = "profiles/generated/candidate.json"

[optimize]
profile_id = "candidate"
target_size_gib = 4.0
methods = ["int8", "int8_convrot", "convrot_w4a4", "convrot_w4a4_mse"]
# Add "int6" or "int6_convrot" to methods to use those formats.
exclude_prefixes = []
exclude_suffixes = []
overwrite = false
